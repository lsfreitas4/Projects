<!DOCTYPE html>
<html>
<head lang="en">

    <meta charset="UTF-8">
	<title>WebCGF Shader Example</title>
	<link rel="icon" href="data:,">
	<style>
		body, html {
			border: 0;
			padding: 0;
			margin: 0;
			overflow: hidden;
		}

		canvas {
			width: 100%;
			height: 100%;
		}
		#shaders
		{
			position: absolute;
			left:0%;
			top: 0%;
			height: 100%;
			width: 40%;
			display: none;
		}
		#vshader, #fshader
		{
			height: 47%;
			width: 100%;
			overflow-x: scroll;
			overflow-y: scroll;
			border: 1px solid black;
		}

				#gameOverScreen {
			position: fixed;
			top: 0;
			left: 0;
			width: 100%;
			height: 100%;
			display: none;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: rgba(0, 0, 0, 0.75);
			color: #ffffff;
			font-family: Arial, Helvetica, sans-serif;
			text-align: center;
			z-index: 1000;
		}
		#gameOverScreen.visible {
			display: flex;
		}
		#gameOverScreen .title {
			font-size: 64px;
			font-weight: bold;
			letter-spacing: 4px;
			margin-bottom: 24px;
			color: #ff4444;
			text-shadow: 0 0 20px rgba(255, 0, 0, 0.6);
		}
		#gameOverScreen .score {
			font-size: 32px;
			margin-bottom: 12px;
		}
		#gameOverScreen .bales {
			font-size: 22px;
			opacity: 0.85;
			margin-bottom: 40px;
		}
		#gameOverScreen button {
			font-size: 24px;
			font-weight: bold;
			padding: 12px 48px;
			cursor: pointer;
			border: none;
			border-radius: 8px;
			background: #4caf50;
			color: #ffffff;
		}
		#gameOverScreen .hint {
			font-size: 16px;
			opacity: 0.6;
			margin-top: 16px;
		}

	</style>

	
</head>

<body>
		
		<script type="module" src="src/main.js"></script>

		<div id="shaders">
			Vertex Shader (VS)
			<div id="vshader">
				(loading...)
			</div>
			Fragment Shader (FS)
			<div id="fshader">				
				(loading...)
			</div>
		</div>	

		<div id="gameOverScreen">
			<div class="title">GAME OVER</div>
			<div class="score" id="gameOverScore">Score: 0 s</div>
			<div class="bales" id="gameOverBales">Bales Delivered: 0</div>
			<button id="restartButton">Restart</button>
			<div class="hint">or press R</div>
		</div>

</body>
</html>
